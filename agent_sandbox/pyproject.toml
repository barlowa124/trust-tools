[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsbx"
version = "0.1.0"
description = "Scripted-agent sandbox + elicitation battery over the agentmon gate and a filesystem jail"
requires-python = ">=3.9"

[project.scripts]
agentsbx = "agentsbx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
