[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modelserve"
version = "0.1.0"
description = "Model-serving slice: queueing, micro-batching, shadow eval, hash-bound response records"
requires-python = ">=3.9"

[project.optional-dependencies]
hf = ["torch", "transformers"]
api = ["fastapi", "uvicorn", "pydantic"]

[project.scripts]
modelserve = "modelserve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
