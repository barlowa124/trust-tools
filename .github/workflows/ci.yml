name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent_trajectory_audit, agent_monitor, eval_harness,
              inference_receipts, model_serve, receipt_report,
              agent_observe, agent_sandbox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test ${{ matrix.pkg }}
        working-directory: ${{ matrix.pkg }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=src python -m pytest tests/ -q

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cross-package interop tests
        run: |
          pip install pytest
          python -m pytest tests/ -q

  oncology-coscientist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: oncology_coscientist
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          python -m pytest tests/ -q

  traj-review-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test + build
        working-directory: traj_review_ui
        run: |
          npm ci
          npm test
          npm run build

  inspect-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Execute exported tasks under Inspect mockllm
        working-directory: eval_harness
        run: |
          pip install inspect_ai .
          for b in abstention injection format; do
            python scripts/verify_inspect_bridge.py \
              probes/${b}_battery.json \
              --out /tmp/inspect_${b}.json
            diff -u validation/inspect_${b}_mockllm.json \
              /tmp/inspect_${b}.json
          done
