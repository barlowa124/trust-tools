name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent_trajectory_audit, inference_receipts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test ${{ matrix.pkg }}
        working-directory: ${{ matrix.pkg }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=src python -m pytest tests/ -q

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cross-package interop tests
        run: |
          pip install pytest
          python -m pytest tests/ -q
