[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentob"
version = "0.1.0"
description = "Agent trace ingestion, live-policy enrichment, and trace reporting"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
agentob = "agentob.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
