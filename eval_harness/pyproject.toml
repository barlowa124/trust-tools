[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalh"
version = "0.1.0"
description = "Provenance-bound eval harness: task specs, deterministic graders, hash-chained run records"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
hf = ["torch", "transformers"]
test = ["pytest"]

[project.scripts]
evalh = "evalh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
