[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rcptreport"
version = "0.1.0"
description = "Audit documents generated from hash-chained eval/serve/receipt logs"
requires-python = ">=3.9"

[project.scripts]
rcptreport = "rcptreport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
