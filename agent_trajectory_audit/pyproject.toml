[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trajaudit"
version = "0.1.0"
description = "Audit coding-agent trajectories for intent/behavior divergence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
trajaudit = "trajaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
